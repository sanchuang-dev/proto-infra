# Default-branch registration stub: NEVER DEPLOY FROM main.
# GitHub workflow_dispatch registration requires this file on main.
name: Publish Local Life MVP app (controlled)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the current protected local-life/mvp commit'
        required: true
        type: boolean
        default: false
      bootstrap_admin:
        description: 'Create the first Local Life application admin (prod-only, only if none exists)'
        required: false
        type: boolean
        default: false
      bootstrap_wechat_master_key:
        description: 'Initialize the Local Life MVP WeChat config master key once (prod-only; refuses an existing key)'
        required: false
        type: boolean
        default: false
      admin_username:
        description: '3-32 character application login name'
        required: false
        type: string
      admin_display_name:
        description: 'Administrator display name'
        required: false
        type: string
      recipient_public_key_b64:
        description: 'Base64-encoded 3072-bit RSA public key for encrypted one-time credentials or master-key backup'
        required: false
        type: string

permissions:
  contents: read

jobs:
  registration-only:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Registration only; real deployment requires proto-infra/prod'
