# Only this trusted infra repo holds the SSH secrets.
# Build untrusted app source in a separate job with NO host secrets; publish reviewed mvp SHA.
name: Publish Local Life MVP app (controlled)

on:
  pull_request:
    branches: [dev, test, prod]
    paths:
      - scripts/install-local-life-mvp-app.sh
      - .github/workflows/publish-local-life-mvp-app.yml
      - docs/local-life-mvp-app-release.md
      - docs/local-life-mvp-wechat-master-key.md
      - scripts/bootstrap-local-life-wechat-master-key.sh
      - scripts/test-local-life-wechat-key-bootstrap.sh
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the current protected local-life/mvp commit'
        required: true
        type: boolean
        default: false
      bootstrap_admin:
        description: 'Create the first Local Life application admin (prod-only, only if none exists)'
        required: false
        type: boolean
        default: false
      bootstrap_wechat_master_key:
        description: 'Initialize the Local Life MVP WeChat config master key once (prod-only; refuses an existing key)'
        required: false
        type: boolean
        default: false
      admin_username:
        description: '3-32 character application login name'
        required: false
        type: string
      admin_display_name:
        description: 'Administrator display name'
        required: false
        type: string
      recipient_public_key_b64:
        description: 'Base64-encoded 3072-bit RSA public key for encrypted one-time credentials or master-key backup'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: proto-infra-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check installer syntax and bounded paths
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/install-local-life-mvp-app.sh scripts/bootstrap-local-life-wechat-master-key.sh scripts/test-local-life-wechat-key-bootstrap.sh
          bash scripts/test-local-life-wechat-key-bootstrap.sh
          grep -Fq 'base=/srv/proto/local-life-mvp' scripts/install-local-life-mvp-app.sh
          grep -Fq -- '-p 127.0.0.1:18081:4080' scripts/install-local-life-mvp-app.sh
          grep -Fq "AUTH_DEV_ENABLED=false" scripts/install-local-life-mvp-app.sh
          grep -Fq 'chmod -R a+rX' scripts/install-local-life-mvp-app.sh
          grep -Fq 'MVP_STATIC_READABLE_BY_CADDY=yes' scripts/install-local-life-mvp-app.sh
          grep -Fq "test -z \"\$(read_old)\"" scripts/install-local-life-mvp-app.sh
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/source/assets" "$tmp/out"
          printf '<html>ok</html>\n' > "$tmp/source/index.html"
          printf 'asset\n' > "$tmp/source/assets/app.js"
          chmod 0644 "$tmp/source/index.html" "$tmp/source/assets/app.js"
          chmod 0755 "$tmp/source" "$tmp/source/assets"
          tar -C "$tmp/source" -czf "$tmp/site.tar.gz" .
          (umask 077; tar -xzf "$tmp/site.tar.gz" --no-same-owner --no-same-permissions -C "$tmp/out")
          test "$(stat -c '%a' "$tmp/out/index.html")" = 600
          chmod -R a+rX "$tmp/out"
          test "$(stat -c '%a' "$tmp/out/index.html")" = 644
          test "$(stat -c '%a' "$tmp/out/assets")" = 755
          echo 'MVP_STATIC_PERMISSION_NORMALIZATION_TEST=PASS'

  package:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.repository == 'sanchuang-dev/proto-infra' && github.ref == 'refs/heads/prod' && inputs.publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Check out protected MVP source, never development head
        uses: actions/checkout@v4
        with:
          repository: sanchuang-dev/local-life
          ref: mvp
          path: source
          persist-credentials: false
      - name: Pin exact source SHA and ensure this is the protected MVP tip
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git -C source rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          expected="$(git ls-remote https://github.com/sanchuang-dev/local-life.git refs/heads/mvp | cut -f1)"
          test "$sha" = "$expected" || { echo "::error::mvp moved during checkout; retry with new source"; exit 1; }
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          echo "MVP_PINNED_SHA=$sha"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - name: Repeat full source checks on pinned MVP commit
        working-directory: source
        run: |
          pnpm install --frozen-lockfile
          pnpm check
      - name: Build two independent origin roots and verify
        working-directory: source
        run: |
          set -euo pipefail
          pnpm --filter @sanchuang-dev/local-life-web build:mvp
          pnpm --filter @sanchuang-dev/local-life-admin build:mvp
          node scripts/mvp/verify-build.mjs
      - name: Build one immutable Linux API image from reviewed source
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ steps.pin.outputs.sha }}"
          docker build -f source/apps/api/Dockerfile -t "local-life-mvp-api:$sha" source
          mkdir -p bundles
          tar -C source/apps/web/dist -czf bundles/web.tar.gz .
          tar -C source/apps/admin/dist -czf bundles/admin.tar.gz .
          docker save "local-life-mvp-api:$sha" | gzip -1 > bundles/api-image.tar.gz
          printf '%s\n' "$sha" > bundles/source-sha.txt
          for tarball in bundles/web.tar.gz bundles/admin.tar.gz; do
            tar -tzf "$tarball" | awk '
              /^\// || /(^|\/)\.\.(\/|$)/ { bad=1 }
              END { exit bad ? 1 : 0 }
            '
          done
          test -s bundles/api-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: local-life-mvp-${{ steps.pin.outputs.sha }}
          path: bundles/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: package
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/prod' && inputs.publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: local-life-mvp
    steps:
      - name: Check out vetted infra release executor, not app source
        uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: local-life-mvp-${{ needs.package.outputs.sha }}
          path: bundles
      - name: Verify immutable source/artifact identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat bundles/source-sha.txt)" = "${{ needs.package.outputs.sha }}"
          for path in web.tar.gz admin.tar.gz api-image.tar.gz; do test -s "bundles/$path"; done
          bash -n scripts/install-local-life-mvp-app.sh
      - name: Install SSH client on disposable runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null
      - name: Deploy immutable release, verify HTTPS and preserve rollback
        shell: bash
        env:
          TARGET_HOST: ${{ secrets.PROTO_HOST }}
          TARGET_USER: ${{ secrets.PROTO_USER }}
          TARGET_PORT: ${{ secrets.PROTO_SSH_PORT }}
          SSHPASS: ${{ secrets.PROTO_SSH_KEY }}
          SOURCE_SHA: ${{ needs.package.outputs.sha }}
        run: |
          set -Eeuo pipefail
          for name in TARGET_HOST TARGET_USER TARGET_PORT SSHPASS SOURCE_SHA; do
            test -n "${!name:-}" || { echo "::error::Missing $name"; exit 1; }
          done
          case "$TARGET_HOST" in 8.148.148.135|proto.3cgroup.cn) ;; *) echo "::error::Unapproved host"; exit 1 ;; esac
          [[ "$TARGET_PORT" =~ ^[0-9]+$ ]] || exit 1
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          install -d -m 0700 "$RUNNER_TEMP/ssh"
          ssh-keyscan -T 10 -p "$TARGET_PORT" -t ed25519 "$TARGET_HOST" 2>/dev/null > "$RUNNER_TEMP/ssh/known_hosts"
          test -s "$RUNNER_TEMP/ssh/known_hosts"
          fingerprint="$(ssh-keygen -lf "$RUNNER_TEMP/ssh/known_hosts" -E sha256 | awk 'NR==1 {print $2}')"
          test "$fingerprint" = "SHA256:wRPdG4mucUA07fKN1V/Fes+r38VK0zYWXZ4BYm/6Niw" || {
            echo "::error::SSH identity mismatch"; exit 1;
          }
          ssh_opts=(-o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 -o ConnectTimeout=12 -p "$TARGET_PORT")
          scp_opts=(-o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 -o ConnectTimeout=12 -P "$TARGET_PORT")
          remote() { sshpass -e ssh -T "${ssh_opts[@]}" "$TARGET_USER@$TARGET_HOST" "$@"; }
          stage="$(remote 'mktemp -d /tmp/local-life-mvp-release.XXXXXX')"
          [[ "$stage" =~ ^/tmp/local-life-mvp-release\.[A-Za-z0-9]+$ ]] || exit 1
          applied=0
          rollback() {
            if test "$applied" = 1; then
              echo "::warning::Release verification failed; requesting bounded rollback"
              if remote "bash '$stage/install-local-life-mvp-app.sh' rollback '$stage' '$SOURCE_SHA'"; then
                remote "rm -rf -- '$stage'" || echo "::warning::Temporary staging cleanup failed"
              else
                echo "::error::Rollback needs operator review; staging retained at $stage"
              fi
            fi
          }
          trap rollback EXIT
          sshpass -e scp -q "${scp_opts[@]}" \
            bundles/web.tar.gz bundles/admin.tar.gz bundles/api-image.tar.gz \
            scripts/install-local-life-mvp-app.sh "$TARGET_USER@$TARGET_HOST:$stage/"
          applied=1
          remote "bash '$stage/install-local-life-mvp-app.sh' apply '$stage' '$SOURCE_SHA'"
          for host in local.proto.3cgroup.cn local-admin.proto.3cgroup.cn; do
            echo "MVP_PUBLIC_HEALTH_CHECK_BEGIN=$host"
            curl -fsS --connect-timeout 8 --max-time 20 "https://$host/api/healthz" > "$RUNNER_TEMP/health.json"
            grep -Fq '"service":"local-life-api"' "$RUNNER_TEMP/health.json"
            echo "MVP_PUBLIC_HEALTH_CHECK_PASS=$host"
            echo "MVP_PUBLIC_INDEX_CHECK_BEGIN=$host"
            curl -fsS --connect-timeout 8 --max-time 20 "https://$host/" -o "$RUNNER_TEMP/$host.html"
            grep -Eq '(src|href)="/assets/' "$RUNNER_TEMP/$host.html"
            echo "MVP_PUBLIC_INDEX_CHECK_PASS=$host"
            asset="$(grep -oE '(src|href)="/assets/[^"]+' "$RUNNER_TEMP/$host.html" | head -n1 | cut -d'"' -f2)"
            test -n "$asset"
            echo "MVP_PUBLIC_ASSET_CHECK_BEGIN=$host"
            curl -fsS --connect-timeout 8 --max-time 20 "https://$host$asset" -o /dev/null
            echo "MVP_PUBLIC_ASSET_CHECK_PASS=$host"
            status="$(curl -s -o /dev/null -w '%{http_code}' "https://$host/api/admin/communities")"
            test "$status" = 401
            echo "MVP_HTTPS_HEALTH_ASSETS_AND_AUTH_PASS=$host"
          done
          curl -fsSL --connect-timeout 8 --max-time 20 https://local-life.proto.3cgroup.cn/ -o /dev/null
          curl -fsSL --connect-timeout 8 --max-time 20 https://benefit.proto.3cgroup.cn/healthz -o /dev/null
          curl -fsSL --connect-timeout 8 --max-time 20 https://proto.3cgroup.cn/ -o /dev/null
          remote "bash '$stage/install-local-life-mvp-app.sh' finalize '$stage' '$SOURCE_SHA'"
          applied=0
          trap - EXIT
          echo "MVP_DEPLOYMENT_VERIFIED_SHA=$SOURCE_SHA"

  bootstrap-admin:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.repository == 'sanchuang-dev/proto-infra' && github.ref == 'refs/heads/prod' && inputs.bootstrap_admin == true && inputs.publish == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: local-life-mvp
    steps:
      - name: Validate inputs, pin host identity and prepare encrypted credential
        id: prepare
        shell: bash
        env:
          TARGET_HOST: ${{ secrets.PROTO_HOST }}
          TARGET_USER: ${{ secrets.PROTO_USER }}
          TARGET_PORT: ${{ secrets.PROTO_SSH_PORT }}
          SSHPASS: ${{ secrets.PROTO_SSH_KEY }}
          ADMIN_USERNAME: ${{ inputs.admin_username }}
          ADMIN_DISPLAY_NAME: ${{ inputs.admin_display_name }}
          RECIPIENT_PUBLIC_KEY_B64: ${{ inputs.recipient_public_key_b64 }}
        run: |
          set -Eeuo pipefail
          ADMIN_USERNAME="${ADMIN_USERNAME,,}"
          [[ "$ADMIN_USERNAME" =~ ^[a-z0-9._-]{3,32}$ ]]
          [[ -n "$ADMIN_DISPLAY_NAME" && ${#ADMIN_DISPLAY_NAME} -le 40 ]]
          [[ "$ADMIN_DISPLAY_NAME" != *$'\n'* && "$ADMIN_DISPLAY_NAME" != *$'\r'* ]]
          [[ ${#RECIPIENT_PUBLIC_KEY_B64} -le 10000 ]]
          [[ "$RECIPIENT_PUBLIC_KEY_B64" =~ ^[A-Za-z0-9+/=]+$ ]]
          test -n "$TARGET_HOST" && test -n "$TARGET_USER" && test -n "$TARGET_PORT" && test -n "$SSHPASS"
          case "$TARGET_HOST" in 8.148.148.135|proto.3cgroup.cn) ;; *) echo 'Unapproved host' >&2; exit 1 ;; esac
          [[ "$TARGET_PORT" =~ ^[0-9]+$ ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends sshpass expect >/dev/null
          umask 077
          mkdir -p "$RUNNER_TEMP/ssh" "$RUNNER_TEMP/admin-bootstrap-credential"
          printf '%s' "$RECIPIENT_PUBLIC_KEY_B64" | base64 --decode > "$RUNNER_TEMP/ssh/recipient.pem"
          openssl rsa -pubin -in "$RUNNER_TEMP/ssh/recipient.pem" -noout -text 2>/dev/null | grep -Fq 'Public-Key: (3072 bit)'
          ssh-keyscan -T 10 -p "$TARGET_PORT" -t ed25519 "$TARGET_HOST" 2>/dev/null > "$RUNNER_TEMP/ssh/known_hosts"
          test -s "$RUNNER_TEMP/ssh/known_hosts"
          fingerprint="$(ssh-keygen -lf "$RUNNER_TEMP/ssh/known_hosts" -E sha256 | awk 'NR==1 {print $2}')"
          test "$fingerprint" = 'SHA256:wRPdG4mucUA07fKN1V/Fes+r38VK0zYWXZ4BYm/6Niw' || {
            echo 'SSH identity mismatch' >&2; exit 1;
          }
          remote() {
            sshpass -e ssh -T -o StrictHostKeyChecking=yes \
              -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts" \
              -o PreferredAuthentications=password -o PubkeyAuthentication=no \
              -o NumberOfPasswordPrompts=1 -o ConnectTimeout=12 \
              -p "$TARGET_PORT" "$TARGET_USER@$TARGET_HOST" "$@"
          }
          db='/srv/proto/local-life-mvp/data/local-life.sqlite'
          # Refuse to bootstrap over any existing admin, including a disabled one.
          remote "test -s '$db' && count=\$(sqlite3 '$db' \"SELECT COUNT(*) FROM staff_accounts WHERE role='admin';\") && test \"\$count\" = 0 && docker inspect -f '{{.State.Running}}' local-life-mvp-api | grep -qx true && docker exec local-life-mvp-api test -s /app/dist/scripts/bootstrap-admin.js"
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          printf '%s' "$password" > "$RUNNER_TEMP/admin-bootstrap-password"
          printf '%s\n' "$ADMIN_USERNAME" > "$RUNNER_TEMP/admin-bootstrap-credential/username.txt"
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/ssh/recipient.pem" \
            -in "$RUNNER_TEMP/admin-bootstrap-password" \
            -out "$RUNNER_TEMP/admin-bootstrap-credential/password.enc" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          chmod 0600 "$RUNNER_TEMP/admin-bootstrap-password" "$RUNNER_TEMP/admin-bootstrap-credential/password.enc"
          echo 'MVP_ADMIN_PREFLIGHT=PASS'
          echo 'MVP_ADMIN_CREDENTIAL_ENCRYPTED_FOR_RECIPIENT=yes'

      - name: Run the repository's one-time bootstrap-admin command
        id: bootstrap
        shell: bash
        env:
          TARGET_HOST: ${{ secrets.PROTO_HOST }}
          TARGET_USER: ${{ secrets.PROTO_USER }}
          TARGET_PORT: ${{ secrets.PROTO_SSH_PORT }}
          SSHPASS: ${{ secrets.PROTO_SSH_KEY }}
          ADMIN_USERNAME: ${{ inputs.admin_username }}
          ADMIN_DISPLAY_NAME: ${{ inputs.admin_display_name }}
        run: |
          set -Eeuo pipefail
          ADMIN_USERNAME="${ADMIN_USERNAME,,}"
          BOOTSTRAP_PASSWORD="$(cat "$RUNNER_TEMP/admin-bootstrap-password")"
          export BOOTSTRAP_PASSWORD
          echo "::add-mask::$BOOTSTRAP_PASSWORD"
          cat > "$RUNNER_TEMP/bootstrap-admin.exp" <<'EXPECT'
          log_user 0
          set timeout 60
          set username $env(ADMIN_USERNAME)
          set display_name $env(ADMIN_DISPLAY_NAME)
          set password $env(BOOTSTRAP_PASSWORD)
          spawn -noecho sshpass -e ssh -tt \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=$env(RUNNER_TEMP)/ssh/known_hosts \
            -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 -o ConnectTimeout=12 \
            -p $env(TARGET_PORT) "$env(TARGET_USER)@$env(TARGET_HOST)" \
            "docker exec -it local-life-mvp-api node dist/scripts/bootstrap-admin.js"
          expect {
            -re {管理员登录名.*: ?} { send -- "$username\r" }
            timeout { exit 31 }
            eof { exit 32 }
          }
          expect {
            -re {管理员显示名称.*: ?} { send -- "$display_name\r" }
            timeout { exit 33 }
            eof { exit 34 }
          }
          expect {
            -re {初始密码.*: ?} { send -- "$password\r" }
            timeout { exit 35 }
            eof { exit 36 }
          }
          expect {
            -re {管理员账户创建成功} {}
            timeout { exit 37 }
            eof { exit 38 }
          }
          expect eof
          set result [wait]
          exit [lindex $result 3]
          EXPECT
          expect -f "$RUNNER_TEMP/bootstrap-admin.exp"
          db='/srv/proto/local-life-mvp/data/local-life.sqlite'
          remote() {
            sshpass -e ssh -T -o StrictHostKeyChecking=yes \
              -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts" \
              -o PreferredAuthentications=password -o PubkeyAuthentication=no \
              -o NumberOfPasswordPrompts=1 -o ConnectTimeout=12 \
              -p "$TARGET_PORT" "$TARGET_USER@$TARGET_HOST" "$@"
          }
          actual="$(remote "sqlite3 -noheader -separator '|' '$db' \"SELECT username || '|' || role || '|' || status FROM staff_accounts WHERE username='$ADMIN_USERNAME';\"")"
          test "$actual" = "$ADMIN_USERNAME|admin|active"
          audit="$(remote "sqlite3 '$db' \"SELECT COUNT(*) FROM audit_logs WHERE event='staff.bootstrap_admin' AND target_id=(SELECT id FROM staff_accounts WHERE username='$ADMIN_USERNAME');\"")"
          test "$audit" = 1
          echo "MVP_ADMIN_CREATED username=$ADMIN_USERNAME role=admin status=active audit=verified"

      - name: Upload only the recipient-encrypted one-time password
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: local-life-mvp-admin-bootstrap-${{ github.run_id }}
          path: ${{ runner.temp }}/admin-bootstrap-credential/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Verify real HTTPS login, administrator role and logout
        if: steps.bootstrap.outcome == 'success'
        shell: bash
        env:
          ADMIN_USERNAME: ${{ inputs.admin_username }}
        run: |
          set -Eeuo pipefail
          ADMIN_USERNAME="${ADMIN_USERNAME,,}"
          umask 077
          password="$(cat "$RUNNER_TEMP/admin-bootstrap-password")"
          echo "::add-mask::$password"
          origin='https://local-admin.proto.3cgroup.cn'
          jar="$RUNNER_TEMP/admin-cookies.txt"
          csrf_json="$RUNNER_TEMP/admin-csrf.json"
          login_json="$RUNNER_TEMP/admin-login.json"
          curl -fsS -c "$jar" "$origin/api/auth/csrf" > "$csrf_json"
          csrf="$(jq -er '.csrfToken' "$csrf_json")"
          ADMIN_USERNAME="$ADMIN_USERNAME" ADMIN_PASSWORD="$password" python3 - "$RUNNER_TEMP/admin-login-payload.json" <<'PY'
          import json, os, sys
          with open(sys.argv[1], 'w', encoding='utf-8') as output:
              json.dump({'username': os.environ['ADMIN_USERNAME'], 'password': os.environ['ADMIN_PASSWORD']}, output)
          PY
          chmod 0600 "$RUNNER_TEMP/admin-login-payload.json"
          curl -fsS -b "$jar" -c "$jar" \
            -H "Origin: $origin" -H 'Content-Type: application/json' \
            -H "x-csrf-token: $csrf" --data-binary @"$RUNNER_TEMP/admin-login-payload.json" \
            "$origin/api/auth/login" > "$login_json"
          jq -e --arg username "$ADMIN_USERNAME" \
            '.authenticated == true and .staff.role == "admin" and .staff.username == $username' \
            "$login_json" >/dev/null
          csrf="$(jq -er '.csrfToken' "$login_json")"
          status="$(curl -sS -b "$jar" -c "$jar" -o /dev/null -w '%{http_code}' \
            -X POST -H "Origin: $origin" -H "x-csrf-token: $csrf" \
            "$origin/api/auth/logout")"
          test "$status" = 204
          curl -fsS -b "$jar" "$origin/api/auth/session" | jq -e '.authenticated == false' >/dev/null
          rm -f "$RUNNER_TEMP/admin-bootstrap-password" "$RUNNER_TEMP/admin-login-payload.json" "$jar" "$csrf_json" "$login_json"
          echo 'MVP_ADMIN_HTTPS_LOGIN_AND_LOGOUT=PASS'


  bootstrap-wechat-master-key:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.repository == 'sanchuang-dev/proto-infra' && github.ref == 'refs/heads/prod' && inputs.bootstrap_wechat_master_key == true && inputs.publish == false && inputs.bootstrap_admin == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: local-life-mvp
    steps:
      - name: Check out the trusted prod infra scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install SSH client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends sshpass >/dev/null

      - name: Verify host identity and current Local Life MVP state
        id: preflight
        shell: bash
        env:
          TARGET_HOST: ${{ secrets.PROTO_HOST }}
          TARGET_USER: ${{ secrets.PROTO_USER }}
          TARGET_PORT: ${{ secrets.PROTO_SSH_PORT }}
          SSHPASS: ${{ secrets.PROTO_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          for name in TARGET_HOST TARGET_USER TARGET_PORT SSHPASS; do
            test -n "${!name:-}" || { echo "::error::Missing $name"; exit 1; }
          done
          case "$TARGET_HOST" in 8.148.148.135|proto.3cgroup.cn) ;; *) echo "::error::Unapproved host"; exit 1 ;; esac
          [[ "$TARGET_PORT" =~ ^[0-9]+$ ]] || exit 1
          install -d -m 0700 "$RUNNER_TEMP/ssh"
          ssh-keyscan -T 10 -p "$TARGET_PORT" -t ed25519 "$TARGET_HOST" 2>/dev/null > "$RUNNER_TEMP/ssh/known_hosts"
          test -s "$RUNNER_TEMP/ssh/known_hosts"
          fingerprint="$(ssh-keygen -lf "$RUNNER_TEMP/ssh/known_hosts" -E sha256 | awk 'NR==1 {print $2}')"
          test "$fingerprint" = "SHA256:wRPdG4mucUA07fKN1V/Fes+r38VK0zYWXZ4BYm/6Niw" || {
            echo "::error::SSH identity mismatch"; exit 1;
          }
          ssh_opts=(-o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 -o ConnectTimeout=12 -p "$TARGET_PORT")
          scp_opts=(-o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 -o ConnectTimeout=12 -P "$TARGET_PORT")
          remote() { sshpass -e ssh -T "${ssh_opts[@]}" "$TARGET_USER@$TARGET_HOST" "$@"; }
          test "$(remote 'id -u')" = 0 || { echo "::error::SSH account must be root for the bounded bootstrap"; exit 1; }
          stage="$(remote 'mktemp -d /tmp/local-life-mvp-release.XXXXXX')"
          [[ "$stage" =~ ^/tmp/local-life-mvp-release\.[A-Za-z0-9]+$ ]] || exit 1
          printf 'STAGE=%s\n' "$stage" >> "$GITHUB_ENV"
          sshpass -e scp -q "${scp_opts[@]}" \
            scripts/bootstrap-local-life-wechat-master-key.sh \
            scripts/install-local-life-mvp-app.sh \
            "$TARGET_USER@$TARGET_HOST:$stage/"
          remote "bash '$stage/bootstrap-local-life-wechat-master-key.sh' preflight '$stage' '$stage/install-local-life-mvp-app.sh'"
          echo 'MVP_WECHAT_MASTER_KEY_REMOTE_PREFLIGHT=PASS'

      - name: Generate key and encrypt the offline backup for the maintainer
        id: prepare_key
        shell: bash
        env:
          RECIPIENT_PUBLIC_KEY_B64: ${{ inputs.recipient_public_key_b64 }}
        run: |
          set -Eeuo pipefail
          [[ ${#RECIPIENT_PUBLIC_KEY_B64} -le 10000 ]]
          [[ "$RECIPIENT_PUBLIC_KEY_B64" =~ ^[A-Za-z0-9+/=]+$ ]]
          umask 077
          mkdir -p "$RUNNER_TEMP/wechat-master-key-backup"
          printf '%s' "$RECIPIENT_PUBLIC_KEY_B64" | base64 --decode > "$RUNNER_TEMP/recipient.pem"
          openssl rsa -pubin -in "$RUNNER_TEMP/recipient.pem" -noout -text 2>/dev/null |
            grep -Fq 'Public-Key: (3072 bit)'
          openssl rand -base64 32 | tr -d '\n' > "$RUNNER_TEMP/wechat-master-key.b64"
          key_b64="$(cat "$RUNNER_TEMP/wechat-master-key.b64")"
          echo "::add-mask::$key_b64"
          [[ "$key_b64" =~ ^[A-Za-z0-9+/]{43}=$ ]]
          decoded_size="$(printf '%s' "$key_b64" | base64 --decode | wc -c | tr -d '[:space:]')"
          test "$decoded_size" = 32
          canonical="$(printf '%s' "$key_b64" | base64 --decode | base64 | tr -d '\n')"
          test "$canonical" = "$key_b64"
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/recipient.pem" \
            -in "$RUNNER_TEMP/wechat-master-key.b64" \
            -out "$RUNNER_TEMP/wechat-master-key-backup/master-key.enc" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          cat > "$RUNNER_TEMP/wechat-master-key-backup/README.md" <<'README'
          # Local Life MVP WeChat master-key backup

          This artifact contains only the RSA-OAEP-SHA256 encrypted backup. It is usable as the active key only when the workflow log contains MVP_WECHAT_MASTER_KEY_INITIALIZED=yes.

          Decrypt on the trusted machine holding the matching RSA private key (OpenSSL prompts for its passphrase):

          openssl pkeyutl -decrypt -inkey /path/to/wechat-master-key-private.pem -in master-key.enc -out master-key.b64 -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256

          Validate without printing the key:
          test "$(base64 --decode < master-key.b64 | wc -c | tr -d '[:space:]')" = 32

          Store the decrypted master-key.b64 only in an encrypted offline password manager or secure backup. Never paste it into GitHub, chat, an Issue, or a log. The matching key generation label is printed as MVP_WECHAT_MASTER_KEY_ID in the successful workflow log.
          README
          echo 'MVP_WECHAT_MASTER_KEY_BACKUP_ENCRYPTED=yes'

      - name: Upload only the recipient-encrypted master-key backup
        if: steps.prepare_key.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: local-life-mvp-wechat-master-key-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/wechat-master-key-backup/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Send the key only over pinned SSH stdin and restart the current image
        id: apply
        shell: bash
        env:
          TARGET_HOST: ${{ secrets.PROTO_HOST }}
          TARGET_USER: ${{ secrets.PROTO_USER }}
          TARGET_PORT: ${{ secrets.PROTO_SSH_PORT }}
          SSHPASS: ${{ secrets.PROTO_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          [[ "$STAGE" =~ ^/tmp/local-life-mvp-release\.[A-Za-z0-9]+$ ]]
          ssh_opts=(-o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 -o ConnectTimeout=12 -p "$TARGET_PORT")
          sshpass -e ssh -T "${ssh_opts[@]}" "$TARGET_USER@$TARGET_HOST" \
            "bash '$STAGE/bootstrap-local-life-wechat-master-key.sh' apply '$STAGE' '$STAGE/install-local-life-mvp-app.sh'" \
            < "$RUNNER_TEMP/wechat-master-key.b64"

      - name: Verify both public origins still serve the same API safely
        if: steps.apply.outcome == 'success'
        shell: bash
        run: |
          set -Eeuo pipefail
          for host in local.proto.3cgroup.cn local-admin.proto.3cgroup.cn; do
            curl -fsS --connect-timeout 8 --max-time 20 "https://$host/api/healthz" |
              grep -Fq '"service":"local-life-api"'
            status="$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 8 --max-time 20 \
              "https://$host/api/admin/communities")"
            test "$status" = 401
            echo "MVP_WECHAT_MASTER_KEY_PUBLIC_API_CHECK_PASS=$host"
          done
          curl -fsS --connect-timeout 8 --max-time 20 https://local.proto.3cgroup.cn/api/auth/methods |
            grep -Fq '"developmentResidentLogin":false'
          echo 'MVP_WECHAT_MASTER_KEY_PUBLIC_HEALTH_AND_AUTH=PASS'

      - name: Remove unused preflight stage when no rollback is pending
        if: always() && steps.apply.outcome != 'failure'
        shell: bash
        env:
          TARGET_HOST: ${{ secrets.PROTO_HOST }}
          TARGET_USER: ${{ secrets.PROTO_USER }}
          TARGET_PORT: ${{ secrets.PROTO_SSH_PORT }}
          SSHPASS: ${{ secrets.PROTO_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${STAGE:-}" ]]; then exit 0; fi
          ssh_opts=(-o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 -o ConnectTimeout=12 -p "$TARGET_PORT")
          sshpass -e ssh -T "${ssh_opts[@]}" "$TARGET_USER@$TARGET_HOST" "rm -rf -- '$STAGE'"

      - name: Remove plaintext key material from the ephemeral runner
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/wechat-master-key.b64" "$RUNNER_TEMP/recipient.pem"
