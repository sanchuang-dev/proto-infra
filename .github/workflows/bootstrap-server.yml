name: Bootstrap Caddy prototype portal (one-time)

# Maintainer-authorized initial deployment. Only the prod promotion that introduces
# this file triggers a server mutation. Delete this workflow after bootstrap.
on:
  push:
    branches: [prod]
    paths:
      - .github/workflows/bootstrap-server.yml

permissions:
  contents: read

concurrency:
  group: proto-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        env:
          PROTO_HOST: ${{ secrets.PROTO_HOST }}
          PROTO_USER: ${{ secrets.PROTO_USER }}
          PROTO_SSH_PORT: ${{ secrets.PROTO_SSH_PORT }}
          SSHPASS: ${{ secrets.PROTO_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for name in PROTO_HOST PROTO_USER PROTO_SSH_PORT SSHPASS; do
            if [[ -z "${!name:-}" ]]; then echo "::error::Missing secret $name"; exit 1; fi
          done
          [[ "$PROTO_SSH_PORT" =~ ^[0-9]+$ ]] || exit 1
          if [[ "$SSHPASS" == *"PRIVATE KEY"* ]]; then
            echo "::error::PROTO_SSH_KEY must contain the SSH password"
            exit 1
          fi
      - name: Fetch and verify official Caddy v2.11.7 (linux amd64)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/caddy.tar.gz" \
            https://github.com/caddyserver/caddy/releases/download/v2.11.7/caddy_2.11.7_linux_amd64.tar.gz
          echo "727b91701a392de6ebc5027509f548bf39979e5216340d0faed8fa5e69c84f8b  $RUNNER_TEMP/caddy.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/caddy.tar.gz" -C "$RUNNER_TEMP" caddy
          "$RUNNER_TEMP/caddy" version
      - name: Install Caddy and portal with password SSH
        env:
          PROTO_HOST: ${{ secrets.PROTO_HOST }}
          PROTO_USER: ${{ secrets.PROTO_USER }}
          PROTO_SSH_PORT: ${{ secrets.PROTO_SSH_PORT }}
          SSHPASS: ${{ secrets.PROTO_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          ssh_opts=(-o StrictHostKeyChecking=accept-new -o "UserKnownHostsFile=$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 -o ConnectTimeout=20)
          ssh_addr="$PROTO_USER@$PROTO_HOST"
          remote_dir=$(sshpass -e ssh -T -p "$PROTO_SSH_PORT" "${ssh_opts[@]}" "$ssh_addr" 'mktemp -d /tmp/proto-bootstrap.XXXXXX')
          [[ "$remote_dir" =~ ^/tmp/proto-bootstrap\.[A-Za-z0-9]+$ ]] || { echo "::error::Unexpected staging directory"; exit 1; }
          sshpass -e scp -q -P "$PROTO_SSH_PORT" "${ssh_opts[@]}" \
            "$RUNNER_TEMP/caddy" Caddyfile ops/caddy.service scripts/bootstrap-server.sh portal/index.html \
            "$ssh_addr:$remote_dir/"
          sshpass -e ssh -T -p "$PROTO_SSH_PORT" "${ssh_opts[@]}" "$ssh_addr" \
            "bash '$remote_dir/bootstrap-server.sh' '$remote_dir'"
      - name: Verify live HTTPS portal
        shell: bash
        run: |
          set -euo pipefail
          body=$(curl -fsSL --retry 8 --retry-delay 5 --retry-all-errors --connect-timeout 8 --max-time 20 \
            https://proto.3cgroup.cn/)
          echo "$body" | grep -Fq '原型展示中心' || { echo "::error::HTTPS did not return portal HTML"; exit 1; }
          echo "LIVE_HTTPS_PORTAL=verified"
