name: Deploy prototype portal (reuse lab layout)

on:
  push:
    branches: [prod]
    paths:
      - scripts/build-lab-portal.sh
      - .github/workflows/deploy-portal.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proto-infra-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build using lab's original template and manifest
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-lab-portal.sh "$RUNNER_TEMP/generated-portal"
          test -s "$RUNNER_TEMP/generated-portal/index.html"
      - name: Upload generated portal using SSH password
        env:
          PROTO_HOST: ${{ secrets.PROTO_HOST }}
          PROTO_USER: ${{ secrets.PROTO_USER }}
          PROTO_SSH_PORT: ${{ secrets.PROTO_SSH_PORT }}
          SSHPASS: ${{ secrets.PROTO_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for name in PROTO_HOST PROTO_USER PROTO_SSH_PORT SSHPASS; do
            if [ -z "${!name:-}" ]; then echo "::error::Missing secret: $name"; exit 1; fi
          done
          [[ "$PROTO_SSH_PORT" =~ ^[0-9]+$ ]] || exit 1
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          install -d -m 700 "$HOME/.ssh"
          ssh_opts=(-o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=accept-new -o "UserKnownHostsFile=$HOME/.ssh/known_hosts" -o ConnectTimeout=20)
          target="$PROTO_USER@$PROTO_HOST"
          stage=$(sshpass -e ssh -T -p "$PROTO_SSH_PORT" "${ssh_opts[@]}" "$target" 'mktemp /tmp/proto-portal.XXXXXX')
          [[ "$stage" =~ ^/tmp/proto-portal\.[A-Za-z0-9]+$ ]] || { echo "::error::Unsafe staging path"; exit 1; }
          sshpass -e scp -q -P "$PROTO_SSH_PORT" "${ssh_opts[@]}" \
            "$RUNNER_TEMP/generated-portal/index.html" "$target:$stage"
          sshpass -e ssh -T -p "$PROTO_SSH_PORT" "${ssh_opts[@]}" "$target" \
            "install -m 0644 '$stage' /srv/proto/portal/current/index.html.next && mv -f /srv/proto/portal/current/index.html.next /srv/proto/portal/current/index.html && rm -f '$stage'"
      - name: Verify exact published homepage and its links
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 6 --retry-delay 3 --retry-all-errors --max-time 25 \
            https://proto.3cgroup.cn/ -o "$RUNNER_TEMP/actual-portal.html"
          cmp "$RUNNER_TEMP/generated-portal/index.html" "$RUNNER_TEMP/actual-portal.html"
          ! grep -Fq 'class="project-repo"' "$RUNNER_TEMP/actual-portal.html"
          ! grep -Fq 'GitHub 项目仓库 ↗' "$RUNNER_TEMP/actual-portal.html"
          test "$(grep -o 'class="open-link"' "$RUNNER_TEMP/actual-portal.html" | wc -l)" -eq 6
          echo "LIVE_PORTAL_REPO_BUTTONS=none"
          echo "LIVE_PORTAL_MATCHES_GENERATED_LAB_TEMPLATE=yes"
