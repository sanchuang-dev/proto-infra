name: Publish first mirror + companion batch
# Caddy-only changes are independently promoted by deploy-benefit-caddy.yml.
# Manual dispatch still supports an intentionally requested mirror-batch republish.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proto-infra-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Prepare pinned public prototypes
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/prepare-mirror-batch.sh "$RUNNER_TEMP/mirrors"
          for slug in ai-mirror beauty-mirror hair-mirror fitting-mirror; do
            tar -tzf "$RUNNER_TEMP/mirrors/$slug.tar.gz" > "$RUNNER_TEMP/$slug.contents"
            grep -Fxq './index.html' "$RUNNER_TEMP/$slug.contents"
          done
          grep -Fxq './assets/app.js' "$RUNNER_TEMP/ai-mirror.contents"
          grep -Fxq './assets/app.js' "$RUNNER_TEMP/beauty-mirror.contents"

      - name: Render shared lab-design portal
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-lab-portal.sh "$RUNNER_TEMP/generated-portal"
          test -s "$RUNNER_TEMP/generated-portal/index.html"

      - name: Deploy via existing SSH password secrets
        shell: bash
        env:
          PROTO_HOST: ${{ secrets.PROTO_HOST }}
          PROTO_USER: ${{ secrets.PROTO_USER }}
          PROTO_SSH_PORT: ${{ secrets.PROTO_SSH_PORT }}
          SSHPASS: ${{ secrets.PROTO_SSH_KEY }}
        run: |
          set -euo pipefail
          for name in PROTO_HOST PROTO_USER PROTO_SSH_PORT SSHPASS; do
            if [[ -z "${!name:-}" ]]; then echo "::error::Missing $name"; exit 1; fi
          done
          [[ "$PROTO_SSH_PORT" =~ ^[0-9]+$ ]] || exit 1
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          install -d -m 0700 "$HOME/.ssh"
          ssh_opts=(-o StrictHostKeyChecking=accept-new -o "UserKnownHostsFile=$HOME/.ssh/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 -o ConnectTimeout=20)
          host="$PROTO_USER@$PROTO_HOST"
          stage=$(sshpass -e ssh -T -p "$PROTO_SSH_PORT" "${ssh_opts[@]}" "$host" 'mktemp -d /tmp/proto-mirrors.XXXXXX')
          [[ "$stage" =~ ^/tmp/proto-mirrors\.[A-Za-z0-9]+$ ]] || { echo "::error::Invalid stage directory"; exit 1; }
          sshpass -e scp -q -P "$PROTO_SSH_PORT" "${ssh_opts[@]}" \
            "$RUNNER_TEMP"/mirrors/*.tar.gz Caddyfile "$RUNNER_TEMP/generated-portal/index.html" \
            ops/caddy.service scripts/install-mirror-batch.sh scripts/validate-proto-auth.sh scripts/manage-proto-auth.sh \
            "$host:$stage/"
          sshpass -e ssh -T -p "$PROTO_SSH_PORT" "${ssh_opts[@]}" "$host" \
            "bash '$stage/install-mirror-batch.sh' '$stage'"

      - name: Verify public portal and locked prototype hosts
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-delay 3 --max-time 25 https://proto.3cgroup.cn/ -o "$RUNNER_TEMP/home.html"
          grep -q '三创 · 演示中心' "$RUNNER_TEMP/home.html"
          echo "PUBLIC_PORTAL=200"
          for slug in ai-mirror beauty-mirror hair-mirror fitting-mirror; do
            host="https://$slug.proto.3cgroup.cn"
            for path in / /index.html; do
              status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$host$path")
              [[ "$status" == 401 ]] || { echo "::error::$slug $path returned $status instead of 401"; exit 1; }
            done
            wrong=$(curl -sS -o /dev/null -w '%{http_code}' -u demo:incorrect --max-time 20 "$host/")
            [[ "$wrong" == 401 ]] || { echo "::error::$slug accepted incorrect credentials"; exit 1; }
            echo "PROTECTED_SITE=$slug:401"
          done
          for path in /assets/app.js /assets/tokens.css; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://ai-mirror.proto.3cgroup.cn$path")
            [[ "$code" == 401 ]] || { echo "::error::Anonymous asset was exposed: $path"; exit 1; }
          done
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://beauty-mirror.proto.3cgroup.cn/assets/app.js)
          [[ "$code" == 401 ]] || { echo "::error::Anonymous beauty asset was exposed"; exit 1; }
          echo "PROTECTED_ASSETS=401"
          echo "AUTHENTICATED_BROWSER_ACCEPTANCE=requires_owner_password_check"
